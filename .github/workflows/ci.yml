name: CI

# Every entry point imports the Markdown stack, so `./mcp_package` is what the
# suite needs — and all of it. No test runner, no linter, no requirements file.
# A step that needs a dependency beyond `./mcp_package` is the signal one
# crept in.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the others: "works on 3.12, broken
      # on 3.10" is exactly the result worth seeing in full.
      fail-fast: false
      matrix:
        # install.sh provisions 3.12 and there is no system-python path, so 3.12
        # is the only version anything runs on. 3.13 is here to catch a break
        # before it reaches the pinned version, not because we support it.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the MCP package and its dependencies
        run: python -m pip install --disable-pip-version-check ./mcp_package

      # Every gate runs even after an earlier one fails, so one push surfaces
      # every problem instead of one problem per round trip.
      - name: Unit tests
        id: unittest
        if: always()
        run: python -m unittest discover -s tests

      - name: Docs in sync with the registry
        id: docs_sync
        if: always()
        run: python scripts/check_docs_sync.py

      - name: Runtime helper duplication
        id: duplication
        if: always()
        run: python scripts/check_runtime_duplication.py

      - name: Summary
        if: always()
        run: |
          {
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Unit tests | ${{ steps.unittest.outcome }} |"
            echo "| Docs sync | ${{ steps.docs_sync.outcome }} |"
            echo "| Duplication | ${{ steps.duplication.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
