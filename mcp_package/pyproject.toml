[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brainhub-mcp"
version = "2.0.0"
description = "BrainHub local MCP server — memory, context, and graph traversal for agent teams"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# markdown-it-py + plugins render page bodies. They are required, not optional:
# the previous hand-written subset renderer silently dropped standard constructs
# (an image produced nothing), which is what pushed authors into pasting raw
# HTML instead. linkify-it-py backs the autolink rule.
dependencies = [
    "mcp>=1.0.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "linkify-it-py>=2.0",
    # Not optional. These subset the vendored CJK face down to the characters a
    # document actually uses; without them the renderer still embeds a CJK face
    # (the whole vendored one), but every document carries ~5 MB of font instead
    # of ~10 KB. They were an extra once, and a clean install therefore produced
    # Chinese PDFs whose text layer could not be searched -- invisible to whoever
    # rendered them, visible only to the client opening the file.
    "fonttools>=4.0",
    "brotli>=1.0",
]
keywords = ["mcp", "memory", "knowledge-base", "wiki", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# `print` is kept as an alias so `pip install brainhub-mcp[print]` still resolves
# for anyone whose scripts pin it; fonttools/brotli are hard dependencies now.
print = []
semantic = ["model2vec>=0.3"]
semantic-quality = ["fastembed>=0.5"]

[project.scripts]
brainhub-mcp = "brainhub_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["brainhub_mcp", "brainhub_core"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".mcpregistry_*",
    ".env",
    ".env.*",
    "*.token",
    "*.key",
    "*.pem",
    "*.p8",
    "*.p12",
    "id_rsa",
    "id_ed25519",
    "dist/",
]
